name: CI
run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  pull_request:
  push:
    paths-ignore:
    - '**.md'

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      matrix:
        lisp: [ccl, sbcl]
        os: [ubuntu-latest]
        emacs_version: [24-5, 25-3, 26-3, 27-1, snapshot]
      fail-fast: false
    steps:

    - uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-23.11
    - uses: purcell/setup-emacs@v6.0
      with:
        version: ${{ matrix.emacs_version }}
    - uses: actions/checkout@v2
    - run: nix-env -i ${{ matrix.lisp }} -f '<nixpkgs>'
    - run: make LISP="${{ matrix.lisp }}" check
